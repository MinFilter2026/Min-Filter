name: Build Min Filter APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Inspect APK
        run: |
          test -s app/build/outputs/apk/debug/*.apk
          unzip -l app/build/outputs/apk/debug/*.apk | grep -q 'lib/arm64-v8a/'
          unzip -l app/build/outputs/apk/debug/*.apk | grep -q 'lib/armeabi-v7a/'
          unzip -l app/build/outputs/apk/debug/*.apk | grep -q 'lib/x86_64/' 

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MinFilter-v1.5.2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
